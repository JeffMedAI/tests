<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — JeffLocal</title>
  <link rel="stylesheet" href="/static/dashboard.css?v=2">
  <style>
    body { background: #f3f4f6; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .login-wrap { width: 100%; max-width: 400px; padding: 24px 16px; }
    .login-card { background: #fff; border-radius: 12px; box-shadow: 0 4px 24px rgba(0,0,0,.08); padding: 36px 32px; }
    .login-logo { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
    .login-logomark { width: 40px; height: 40px; border-radius: 10px; background: #1d4ed8; color: #fff; font-weight: 800; font-size: 16px; display: flex; align-items: center; justify-content: center; letter-spacing: -.5px; }
    .login-org { font-weight: 700; font-size: 17px; color: #111827; line-height: 1.2; }
    .login-subtitle { font-size: 11px; color: #6b7280; }
    h1.login-heading { font-size: 18px; font-weight: 700; color: #111827; margin: 0 0 6px; }
    .login-desc { font-size: 13px; color: #6b7280; margin: 0 0 24px; }
    .login-tabs { display: flex; gap: 4px; background: #f3f4f6; border-radius: 8px; padding: 3px; margin-bottom: 20px; }
    .login-tab { flex: 1; text-align: center; padding: 7px 0; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; color: #6b7280; border: none; background: transparent; transition: all .15s; }
    .login-tab.active { background: #fff; color: #111827; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 12px; font-weight: 600; color: #374151; margin-bottom: 5px; }
    input[type="text"], input[type="password"], input[type="tel"] {
      width: 100%; box-sizing: border-box; border: 1px solid #d1d5db; border-radius: 8px;
      padding: 9px 12px; font-size: 14px; color: #111827; outline: none; transition: border-color .15s;
    }
    input:focus { border-color: #1d4ed8; box-shadow: 0 0 0 2px rgba(29,78,216,.12); }
    .pin-row { display: flex; gap: 8px; }
    .pin-digit { flex: 1; text-align: center; font-size: 20px; font-weight: 600; letter-spacing: .1em; padding: 10px 4px; }
    .btn-primary { width: 100%; padding: 10px; background: #1d4ed8; color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 4px; transition: background .15s; }
    .btn-primary:hover { background: #1e40af; }
    .login-info { background: #eff6ff; border: 1px solid #bfdbfe; color: #1d4ed8; border-radius: 8px; padding: 10px 14px; font-size: 13px; margin-bottom: 16px; }
    .login-footer { margin-top: 20px; text-align: center; }
    .login-footer a { font-size: 12px; color: #6b7280; text-decoration: none; }
    .login-footer a:hover { color: #1d4ed8; text-decoration: underline; }
    .pin-panel, .password-panel { display: none; }
    .pin-panel.active, .password-panel.active { display: block; }
    /* Error modal */
    .auth-modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; z-index: 9999; }
    .auth-modal { background: #fff; border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,.18); padding: 28px 28px 22px; max-width: 360px; width: 90%; text-align: center; }
    .auth-modal-icon { font-size: 28px; margin-bottom: 10px; }
    .auth-modal h2 { font-size: 16px; font-weight: 700; color: #111827; margin: 0 0 8px; }
    .auth-modal p { font-size: 13px; color: #4b5563; margin: 0 0 18px; line-height: 1.5; }
    .auth-modal-ok { background: #1d4ed8; color: #fff; border: none; border-radius: 8px; padding: 9px 28px; font-size: 14px; font-weight: 600; cursor: pointer; }
    .auth-modal-ok:hover { background: #1e40af; }
    .login-info { background: #eff6ff; border: 1px solid #bfdbfe; color: #1d4ed8; border-radius: 8px; padding: 10px 14px; font-size: 13px; margin-bottom: 16px; }
  </style>
</head>
<body>
  {% if error %}
  <div class="auth-modal-backdrop" id="auth-error-modal">
    <div class="auth-modal" role="dialog" aria-modal="true" aria-labelledby="auth-modal-title">
      <div class="auth-modal-icon">🔒</div>
      <h2 id="auth-modal-title">Sign-in failed</h2>
      <p>{{ error }}</p>
      <button class="auth-modal-ok" onclick="document.getElementById('auth-error-modal').remove(); document.querySelector('input[name=username]').focus();">OK</button>
    </div>
  </div>
  {% endif %}

  <div class="login-wrap">
    <div class="login-card">
      <div class="login-logo">
        <div class="login-logomark">JL</div>
        <div>
          <div class="login-org">JeffLocal</div>
          <div class="login-subtitle">Churchtown Medical Centre</div>
        </div>
      </div>

      <h1 class="login-heading">Staff sign in</h1>
      <p class="login-desc">Enter your username and password or PIN to access the dashboard.</p>

      {% if info %}
        <div class="login-info">{{ info }}</div>
      {% endif %}

      <div class="login-tabs">
        <button class="login-tab active" id="tab-password" onclick="switchTab('password')">Password</button>
        <button class="login-tab" id="tab-pin" onclick="switchTab('pin')">PIN</button>
      </div>

      <!-- Password form -->
      <div class="password-panel active" id="panel-password">
        <form method="post" action="/login">
          <input type="hidden" name="auth_method" value="password">
          {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" value="{{ prefill_username }}" required>
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required>
          </div>
          <button type="submit" class="btn-primary">Sign in</button>
        </form>
      </div>

      <!-- PIN form -->
      <div class="pin-panel" id="panel-pin">
        <form method="post" action="/login">
          <input type="hidden" name="auth_method" value="pin">
          {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
          <div class="form-group">
            <label for="username-pin">Username</label>
            <input type="text" id="username-pin" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" value="{{ prefill_username }}">
          </div>
          <div class="form-group">
            <label>PIN (4–6 digits)</label>
            <input type="tel" name="pin" inputmode="numeric" pattern="[0-9]{4,6}" maxlength="6" placeholder="••••" autocomplete="off" required>
          </div>
          <button type="submit" class="btn-primary">Sign in with PIN</button>
        </form>
      </div>

      <div class="login-footer">
        <a href="/forgot">Forgot password or PIN?</a>
      </div>
    </div>
  </div>

  <script>
    function switchTab(tab) {
      document.getElementById('panel-password').classList.toggle('active', tab === 'password');
      document.getElementById('panel-pin').classList.toggle('active', tab === 'pin');
      document.getElementById('tab-password').classList.toggle('active', tab === 'password');
      document.getElementById('tab-pin').classList.toggle('active', tab === 'pin');
    }
    // Auto-switch to PIN tab if returning from PIN error
    {% if auth_method == 'pin' %}switchTab('pin');{% endif %}
  </script>
</body>
</html>
