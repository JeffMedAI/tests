[pytest]
# JeffLocal dashboard test configuration
# Run all tests:         pytest
# Run E2E tests only:    pytest tests/e2e/
# Run unit tests only:   pytest tests/ --ignore=tests/e2e/

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Suppress Playwright deprecation warnings
filterwarnings =
    ignore::DeprecationWarning:playwright

# Markers used in the E2E suite
markers =
    e2e: end-to-end Playwright tests (require a running dashboard instance)
    unit: unit tests (no running app required)
